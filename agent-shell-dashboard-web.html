<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Agent Shell</title>
<style>
  :root { --bg: #5a5475; --fg: #f8f8f2; --shadow: #b8a2ce; --header: #c2ffdf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  button { font: inherit; color: var(--fg); background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.16); }
  input, textarea { font: inherit; color: var(--fg); background: rgba(0,0,0,.18);
    border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 5px 8px; }
  .shadow { color: var(--shadow); }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
    padding: 8px 14px; background: var(--bg); border-bottom: 1px solid rgba(255,255,255,.12); }
  .bar .grow { flex: 1; }
  #search { width: min(420px, 40vw); }

  #board { display: flex; gap: 14px; padding: 12px 14px; align-items: flex-start; }
  #pinned { display: flex; gap: 14px; flex: 0 0 auto; }
  #rest { flex: 1; display: grid; gap: 18px 14px;
    grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); }
  .col { width: 560px; max-width: 100%; }
  #rest .col { width: auto; }
  .col h2 { margin: 0 0 6px; font-size: 18px; color: var(--header); }
  .col h2 .shadow { font-size: 12px; font-weight: normal; }
  .col.empty h2 { color: var(--shadow); }

  .row { padding: 2px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; }
  .row:hover { outline: 1px solid rgba(255,255,255,.35); }
  .row .l1, .row .l2 { overflow: hidden; text-overflow: ellipsis; }
  .row .l2 { padding-left: 4.5em; }
  .mark { color: #ffb8d1; font-weight: bold; display: inline-block; width: 1ch; }
  .ago { display: inline-block; width: 8ch; }
  .fork { font-weight: bold; }
  .flat .row .project { color: var(--header); }
  .col h2 .new { font-size: 13px; padding: 0 7px; margin-left: 6px; vertical-align: middle; }
  #new-menu { display: none; position: absolute; right: 14px; top: 44px; z-index: 5;
    max-height: 60vh; overflow: auto; min-width: 260px; background: var(--bg);
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 6px; }
  #new-menu input { width: 100%; margin-bottom: 6px; }
  #new-menu div { padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  #new-menu div:hover { background: rgba(255,255,255,.12); }

  #session { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
  body.in-session { overflow: hidden; }
  #session > * { min-width: 0; }
  #session .title { flex: 1 1 auto; min-width: 0; }
  #session .bar { gap: 8px; }
  #text .pending { opacity: .55; }
  #tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.12); scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; max-width: 240px; padding: 4px 10px; border-radius: 6px 6px 0 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    opacity: .7; border: 1px solid transparent; border-bottom: none; }
  .tab:hover { opacity: 1; }
  .tab.active { opacity: 1; border-color: rgba(255,255,255,.35); font-weight: bold; }
  #session .title { font-weight: bold; color: var(--header); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #summary { padding: 4px 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #text { flex: 1; overflow: auto; margin: 0; padding: 10px 14px; font: inherit;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  #compose { display: flex; gap: 8px; padding: 8px 14px; border-top: 1px solid rgba(255,255,255,.12); }
  #prompt { flex: 1; min-height: 3.4em; max-height: 40vh; resize: vertical; }
  #queued { padding: 0 14px 4px; }
  #closed { padding: 14px; }
  .busy { color: #a8b6ff; }
  #text .inv { display: none; }
  #text [data-r="i"], #text [data-r="l"] { cursor: pointer; }
  #text { touch-action: pan-y pinch-zoom; }
  #text [data-r="l"]:hover { text-decoration: underline; }

  #auth { display: none; padding: 40px; max-width: 640px; }
  #auth input { width: 100%; margin: 10px 0; }

  @media (max-width: 900px) {
    #board { flex-direction: column; }
    #pinned { flex-direction: column; width: 100%; }
    .col, #rest { width: 100%; }
    #rest { grid-template-columns: 1fr; }
    #search { width: 100%; }
    .wide { display: none; }
    #prompt { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="auth">
  <h2>Token needed</h2>
  <p class="shadow">Run <code>M-x agent-shell-dashboard-web-url</code> in Emacs and open
    the copied URL, or paste it (or just the token) here.</p>
  <input id="token-input" placeholder="http://…/#token">
  <button onclick="saveToken()">Use token</button>
</div>

<div id="dashboard">
  <div class="bar">
    <span id="counts" class="shadow">Agent Shell</span>
    <span class="grow"></span>
    <button onclick="toggleNewMenu()">+ new</button>
    <label class="shadow"><input type="checkbox" id="show-closed"> closed</label>
    <input id="search" placeholder="search (literal, space-separated)" autocomplete="off">
  </div>
  <div id="new-menu"><input id="new-filter" placeholder="project…" autocomplete="off"><div id="new-list"></div></div>
  <div id="board"><div id="pinned"></div><div id="rest"></div></div>
</div>

<div id="session">
  <div id="tabs"></div>
  <div class="bar">
    <button onclick="go('')">←<span class="wide"> back</span></button>
    <span class="title" id="session-name"></span>
    <span id="state" class="shadow"></span>
    <button id="stop" onclick="interrupt()">cancel</button>
  </div>
  <div id="summary" class="shadow"></div>
  <pre id="text"></pre>
  <div id="closed" style="display:none">
    <p class="shadow">This session is closed.</p>
    <button onclick="resume()">Resume it in Emacs</button>
  </div>
  <div id="queued" class="shadow"></div>
  <div id="compose">
    <textarea id="prompt" placeholder="Message (Enter to send, Shift+Enter for a newline)"></textarea>
    <button onclick="send()">send</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("asd-token");
let data = null;
let current = null;       // {buffer, session_id}
let tick = null;
let timer = null;

if (location.hash && !location.hash.startsWith("#/")) {
  token = decodeURIComponent(location.hash.slice(1));
  localStorage.setItem("asd-token", token);
  history.replaceState(null, "", location.pathname);
}

function loadFont() {
  if (!token || document.getElementById("emacs-font")) return;
  const link = document.createElement("link");
  link.id = "emacs-font";
  link.rel = "stylesheet";
  link.href = "/font.css?token=" + encodeURIComponent(token);
  document.head.appendChild(link);
}

function saveToken() {
  const v = $("token-input").value.trim();
  token = v.includes("#") ? v.slice(v.indexOf("#") + 1) : v;
  localStorage.setItem("asd-token", token);
  $("auth").style.display = "none";
  loadFont();
  route();
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 401) {
    $("dashboard").style.display = "none";
    $("session").style.display = "none";
    $("auth").style.display = "block";
    throw new Error("unauthorized");
  }
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function applyTheme(t) {
  const r = document.documentElement.style;
  if (t.bg) r.setProperty("--bg", t.bg);
  if (t.fg) r.setProperty("--fg", t.fg);
  if (t.shadow) r.setProperty("--shadow", t.shadow);
  if (t.header) r.setProperty("--header", t.header);
}

function rowHtml(row, project) {
  const fork = row.fork ? `<span class="fork" style="color:${row.fork.color}">⑂${row.fork.letter}</span> ` : "";
  const proj = project ? `<span class="project">${esc(project)}</span> ` : "";
  return `<div class="row" style="background:${row.tint || "transparent"}"
      data-buffer="${esc(row.buffer || "")}" data-session="${esc(row.session_id || "")}">
    <div class="l1"><span class="mark">${row.marked ? "*" : " "}</span>
      <span style="color:${row.glyph.color || "inherit"}">${esc(row.glyph.char)}</span>
      <span class="ago shadow">${esc(row.ago)}</span>
      ${proj}${fork}${esc(row.summary) || '<span class="shadow">—</span>'}</div>
    <div class="l2 shadow">&gt; ${esc(row.preview) || "—"}</div>
  </div>`;
}

function columnHtml(group, showClosed) {
  const rows = group.rows.filter((r) => showClosed || r.live);
  const live = group.rows.filter((r) => r.live).length;
  if (!rows.length) return "";
  const dir = group.rows.find((r) => r.cwd)?.cwd;
  return `<div class="col ${live ? "" : "empty"}">
    <h2>${esc(group.project)} <span class="shadow">(${live} live, ${group.rows.length - live} closed)</span>${dir
      ? ` <button class="new" data-new="${esc(dir)}" title="new session in ${esc(dir)}">+</button>` : ""}</h2>
    ${rows.map((r) => rowHtml(r)).join("")}
  </div>`;
}

function renderDashboard() {
  if (!data) return;
  applyTheme(data.theme);
  $("counts").textContent = `Agent Shell — ${data.live} live, ${data.closed} closed across ${data.groups.length} projects`;
  const showClosed = $("show-closed").checked;
  const terms = $("search").value.toLowerCase().split(/\s+/).filter(Boolean);

  if (terms.length) {
    const hits = data.groups.flatMap((g) => g.rows.map((r) => ({ r, p: g.project })))
      .filter(({ r, p }) => {
        const hay = `${p} ${r.summary} ${r.preview}`.toLowerCase();
        return terms.every((t) => hay.includes(t));
      })
      .sort((a, b) => b.r.time - a.r.time);
    $("pinned").innerHTML = "";
    $("rest").innerHTML = `<div class="col flat">${hits.map(({ r, p }) => rowHtml(r, p)).join("") ||
      '<span class="shadow">no matches</span>'}</div>`;
    return;
  }

  const pinned = new Set(data.pinned);
  $("pinned").innerHTML = data.groups.filter((g) => pinned.has(g.project))
    .map((g) => columnHtml(g, showClosed)).join("");
  $("rest").innerHTML = data.groups.filter((g) => !pinned.has(g.project))
    .map((g) => columnHtml(g, showClosed)).join("");
}

async function loadDashboard() {
  data = await api("/api/sessions");
  renderDashboard();
}

function tabLabel(r) {
  const text = (r.summary || r.buffer || "").split(";")[0].trim();
  return text.length > 32 ? text.slice(0, 31) + "…" : text;
}

let tabOrder = [];

function renderTabs() {
  if (!data || !current) return;
  const rows = data.groups.flatMap((g) => g.rows).filter((r) => r.live &&
    (r.marked || r.recency === "recent" || r.status === "working" || r.buffer === current.buffer));
  const byBuffer = new Map(rows.map((r) => [r.buffer, r]));
  if (!tabOrder.length) tabOrder = [...rows].sort((a, b) => b.time - a.time).map((r) => r.buffer);
  tabOrder = tabOrder.filter((b) => byBuffer.has(b));
  for (const r of [...rows].sort((a, b) => b.time - a.time))
    if (!tabOrder.includes(r.buffer)) tabOrder.push(r.buffer);
  tabOrder = tabOrder.slice(0, 14);
  if (!tabOrder.includes(current.buffer) && byBuffer.has(current.buffer)) tabOrder.push(current.buffer);
  $("tabs").innerHTML = tabOrder.map((b) => byBuffer.get(b)).map((r) => `<div class="tab ${r.buffer === current.buffer ? "active" : ""}"
      style="background:${r.tint || "rgba(255,255,255,.06)"}" data-tab="${esc(r.buffer)}"
      title="${esc(r.buffer + " — " + (r.summary || ""))}">
      <span style="color:${r.glyph.color || "inherit"}">${esc(r.glyph.char)}</span> ${esc(tabLabel(r))}</div>`).join("");
  $("tabs").querySelector(".active")?.scrollIntoView({ inline: "nearest", block: "nearest" });
}

async function loadTabs() {
  data = await api("/api/sessions");
  renderTabs();
}

function findRow(buffer, session) {
  for (const g of data?.groups || [])
    for (const r of g.rows)
      if ((buffer && r.buffer === buffer) || (!buffer && session && r.session_id === session)) return r;
  return null;
}

async function loadSession() {
  if (!current) return;
  if (!current.buffer) {
    const row = findRow(null, current.session_id);
    $("session-name").textContent = current.session_id;
    $("summary").textContent = row?.summary || "";
    $("text").textContent = "";
    $("closed").style.display = "block";
    $("compose").style.display = "none";
    $("stop").style.display = "none";
    $("state").textContent = "closed";
    return;
  }
  $("closed").style.display = "none";
  $("compose").style.display = "flex";
  $("stop").style.display = "";
  const buffer = current.buffer;
  const s = await api("/api/session", { buffer, tick });
  if (current?.buffer !== buffer) return;
  $("state").textContent = s.busy ? "working…" : "idle";
  $("state").className = s.busy ? "busy" : "shadow";
  $("queued").textContent = s.queued.length ? `queued: ${s.queued.join(" | ")}` : "";
  if (s.unchanged) return;
  const pre = $("text");
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 80 || tick === null;
  shown = s;
  paint();
  if (s.summary) $("summary").textContent = s.summary.split("\n")[0];
  if (atBottom) pre.scrollTop = pre.scrollHeight;
  tick = s.tick;
}

let shown = null;
let toggled = new Map();
let bodies = new Map();

function styleCss(styles) {
  return styles.map((st) => [
    st.fg && `color:${st.fg}`, st.bg && `background:${st.bg}`,
    st.bold && "font-weight:bold", st.italic && "font-style:italic",
    st.underline && "text-decoration:underline",
  ].filter(Boolean).join(";"));
}

function runsHtml(runs, styles) {
  const css = styleCss(styles);
  return runs.map(([text, style]) =>
    `<span${css[style] ? ` style="${css[style]}"` : ""}>${esc(text)}</span>`).join("");
}

async function loadBody(sec) {
  bodies.set(sec, '<span class="shadow">…</span>');
  try {
    const r = await api("/api/section", { buffer: current.buffer, section: sec });
    bodies.set(sec, runsHtml(r.runs, r.styles));
  } catch (e) {
    bodies.set(sec, `<span class="shadow">(${esc(e.message)})</span>`);
  }
  paint();
}

function paint() {
  if (!shown) return;
  const css = styleCss(shown.styles);
  const emitted = new Set();
  const name = (i) => (i >= 0 ? shown.sections[i] : "");
  const collapsedInEmacs = new Map();
  for (const [, , hidden, i, role] of shown.runs)
    if (i >= 0 && role === "b") collapsedInEmacs.set(name(i), !!hidden);
  const open = (sec) => toggled.has(sec) ? toggled.get(sec) : !collapsedInEmacs.get(sec);

  $("text").innerHTML = (shown.truncated ? '<span class="shadow">… (earlier output trimmed)\n\n</span>' : "") +
    shown.runs.map(([text, style, hidden, i, role]) => {
      const sec = name(i);
      if (sec && collapsedInEmacs.has(sec)) {
        if (role === "b") {
          if (!open(sec)) return "";
          if (!text) {
            if (emitted.has(sec)) return "";
            emitted.add(sec);
            return `<span data-b="${esc(sec)}">${bodies.get(sec) ?? '<span class="shadow">…</span>'}</span>`;
          }
          hidden = false;
        }
        if (role === "i") text = text.replace(/^[▶▼]/, open(sec) ? "▼" : "▶");
      }
      if (hidden && !text) return "";
      const attrs = (hidden ? ' class="inv"' : "") + (css[style] ? ` style="${css[style]}"` : "") +
        (sec && (role === "i" || role === "l") ? ` data-s="${esc(sec)}" data-r="${role}"` : "") +
        (sec && role === "b" ? ` data-b="${esc(sec)}"` : "");
      return `<span${attrs}>${esc(text)}</span>`;
    }).join("");
}

$("text").addEventListener("click", (e) => {
  const head = e.target.closest("[data-s]");
  if (!head || getSelection().toString()) return;
  const sec = head.dataset.s;
  const index = shown.sections.indexOf(sec);
  const body = shown.runs.find(([, , , s, r]) => s === index && r === "b");
  const isOpen = toggled.has(sec) ? toggled.get(sec) : !(body && body[2]);
  toggled.set(sec, !isOpen);
  if (!isOpen && body && !body[0] && !bodies.has(sec)) loadBody(sec);
  paint();
});

let sending = false;

async function send() {
  const prompt = $("prompt").value.trim();
  if (!prompt || !current?.buffer || sending) return;
  sending = true;
  $("prompt").value = "";

  const pre = $("text");
  const pending = document.createElement("span");
  pending.className = "pending";
  pending.textContent = "\n" + prompt + "\n";
  pre.appendChild(pending);
  pre.scrollTop = pre.scrollHeight;

  try {
    await api("/api/send", { buffer: current.buffer, prompt });
    tick = null;
    loadSession().catch(console.error);
  } catch (e) {
    pending.remove();
    if (!$("prompt").value) $("prompt").value = prompt;
    alert("Send failed: " + e.message);
  } finally {
    sending = false;
  }
}

async function interrupt() {
  if (current?.buffer)
    await api("/api/interrupt", { buffer: current.buffer }).catch((e) => alert(e.message));
}

let projects = [];

async function newSession(dir) {
  $("new-menu").style.display = "none";
  try {
    const r = await api("/api/new", { dir });
    if (r.buffer) go("s/" + encodeURIComponent(r.buffer));
  } catch (e) { alert("Could not start a session: " + e.message); }
}

function renderNewList() {
  const q = $("new-filter").value.toLowerCase();
  $("new-list").innerHTML = projects.filter((p) => (p.name + " " + p.dir).toLowerCase().includes(q))
    .map((p) => `<div data-new="${esc(p.dir)}" title="${esc(p.dir)}">${esc(p.name)} <span class="shadow">${esc(p.dir)}</span></div>`).join("");
}

async function toggleNewMenu() {
  const menu = $("new-menu");
  if (menu.style.display === "block") { menu.style.display = "none"; return; }
  menu.style.display = "block";
  $("new-filter").value = "";
  projects = (await api("/api/projects")).projects;
  renderNewList();
  $("new-filter").focus();
}

async function resume() {
  try {
    const r = await api("/api/resume", { session_id: current.session_id });
    if (r.buffer) go("s/" + encodeURIComponent(r.buffer));
  } catch (e) { alert("Resume failed: " + e.message); }
}

function go(path) { location.hash = path ? "#/" + path : ""; }

function route() {
  clearInterval(timer);
  const m = location.hash.match(/^#\/(s|c)\/(.+)$/);
  if (m) {
    current = m[1] === "s" ? { buffer: decodeURIComponent(m[2]) } : { session_id: decodeURIComponent(m[2]) };
    tick = null;
    shown = null;
    toggled = new Map();
    bodies = new Map();
    $("dashboard").style.display = "none";
    $("session").style.display = "flex";
    document.body.classList.add("in-session");
    $("session-name").textContent = current.buffer || "";
    $("summary").textContent = findRow(current.buffer, current.session_id)?.summary || "";
    $("text").textContent = "loading…";
    renderTabs();
    loadSession().catch(console.error);
    loadTabs().catch(console.error);
    let beat = 0;
    timer = setInterval(() => {
      if (document.hidden) return;
      loadSession().catch(console.error);
      if (++beat % 2 === 0) loadTabs().catch(console.error);
    }, 1500);
  } else {
    current = null;
    document.body.classList.remove("in-session");
    $("session").style.display = "none";
    $("dashboard").style.display = "block";
    loadDashboard().catch(console.error);
    timer = setInterval(() => { if (!document.hidden) loadDashboard().catch(console.error); }, 3000);
  }
}

document.addEventListener("click", (e) => {
  const fresh = e.target.closest("[data-new]");
  if (fresh) return newSession(fresh.dataset.new);
  if (!e.target.closest("#new-menu, [onclick^='toggleNewMenu']")) $("new-menu").style.display = "none";
  const tab = e.target.closest(".tab");
  if (tab) return go("s/" + encodeURIComponent(tab.dataset.tab));
  const row = e.target.closest(".row");
  if (!row) return;
  if (row.dataset.buffer) go("s/" + encodeURIComponent(row.dataset.buffer));
  else go("c/" + encodeURIComponent(row.dataset.session));
});
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("search").addEventListener("input", renderDashboard);
$("new-filter").addEventListener("input", renderNewList);
$("new-filter").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const first = $("new-list").querySelector("[data-new]"); if (first) newSession(first.dataset.new); }
  if (e.key === "Escape") $("new-menu").style.display = "none";
});
$("show-closed").checked = localStorage.getItem("asd-closed") !== "0";
$("show-closed").addEventListener("change", (e) => {
  localStorage.setItem("asd-closed", e.target.checked ? "1" : "0");
  renderDashboard();
});
window.addEventListener("hashchange", route);

function switchTab(step) {
  const i = tabOrder.indexOf(current?.buffer);
  const next = i < 0 ? null : tabOrder[i + step];
  if (next) go("s/" + encodeURIComponent(next));
  return !!next;
}

(() => {
  const pane = $("text");
  let x0 = null, y0 = 0, horizontal = null, dx = 0;
  const settle = () => {
    pane.style.transition = "transform .18s ease, opacity .18s ease";
    pane.style.transform = "";
    pane.style.opacity = "";
  };
  pane.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    x0 = e.touches.length === 1 && t.clientX > 24 && t.clientX < innerWidth - 24 ? t.clientX : null;
    y0 = t.clientY; horizontal = null; dx = 0;
  }, { passive: true });
  pane.addEventListener("touchmove", (e) => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if (horizontal === null && Math.hypot(dx, dy) > 12) horizontal = Math.abs(dx) > Math.abs(dy) * 1.5;
    if (!horizontal) return;
    pane.style.transition = "none";
    pane.style.transform = `translateX(${dx * 0.4}px)`;
    pane.style.opacity = String(1 - Math.min(0.4, Math.abs(dx) / 600));
  }, { passive: true });
  const end = () => {
    if (horizontal && Math.abs(dx) > 70) switchTab(dx < 0 ? 1 : -1);
    x0 = null;
    settle();
  };
  pane.addEventListener("touchend", end);
  pane.addEventListener("touchcancel", end);
})();
if (!token) $("auth").style.display = "block", $("dashboard").style.display = "none";
else { loadFont(); route(); }
</script>
</body>
</html>
